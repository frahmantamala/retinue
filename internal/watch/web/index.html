<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>retinue watch</title>
<style>
  :root {
    --ground: #0e0e0d;
    --ink: #f2f0ea;
    --marigold: #e0a63c;
    --muted: #6b6b64;
    --dim: #2a2a27;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow: hidden;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; gap: 20px; align-items: baseline;
    padding: 14px 18px;
    pointer-events: none;
  }
  h1 { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; margin: 0; color: var(--marigold); }
  .meta { color: var(--muted); }
  .meta b { color: var(--ink); font-weight: 400; }
  #status { margin-left: auto; color: var(--muted); }
  #status.live::before { content: "● "; color: #7fb069; }
  #status.down::before { content: "● "; color: #c1553f; }
  #empty {
    position: fixed; inset: 0;
    display: grid; place-content: center; place-items: center; gap: 6px;
    color: var(--muted); text-align: center; pointer-events: none;
  }
  #empty.hidden { display: none; }
  #empty .big { color: var(--ink); letter-spacing: .04em; }
  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; gap: 18px; padding: 14px 18px;
    color: var(--muted); pointer-events: none;
  }
  .key { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 9px; height: 9px; border-radius: 50%; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header>
  <h1>retinue watch</h1>
  <div class="meta" id="sessionMeta"></div>
  <div id="status">connecting</div>
</header>

<div id="empty">
  <div class="big">waiting for events</div>
  <div id="emptyWhy">no agent activity on this session yet</div>
</div>

<footer>
  <span class="key"><span class="swatch" style="background:var(--marigold)"></span>lead</span>
  <span class="key"><span class="swatch" style="background:var(--ink)"></span>crew</span>
  <span class="key">solid ring = running tool</span>
  <span class="key">dashed = idle</span>
  <span class="key">radius = tokens</span>
</footer>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("status");
  const emptyEl = document.getElementById("empty");
  const emptyWhy = document.getElementById("emptyWhy");

  const nodes = new Map();   // id -> node model
  const edges = new Map();   // key -> {from, to, rel}
  const pulses = [];         // {from, to, t0}

  const PULSE_MS = 900;
  let width = 0, height = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  fetch("/session").then(r => r.json()).then(s => {
    document.getElementById("sessionMeta").innerHTML =
      `<b>${escapeHtml(s.repo.split("/").pop())}</b> · session <b>${escapeHtml(s.id.slice(0, 8))}</b>`;
  }).catch(() => {});

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---- model ---------------------------------------------------------------

  function upsertNode(m) {
    let n = nodes.get(m.id);
    if (!n) {
      // Seed crew around the centre so the layout unfolds outward from the lead.
      const angle = Math.random() * Math.PI * 2;
      const radius = m.role === "lead" ? 0 : 120 + Math.random() * 90;
      n = {
        id: m.id,
        x: width / 2 + Math.cos(angle) * radius,
        y: height / 2 + Math.sin(angle) * radius,
        vx: 0, vy: 0,
      };
      nodes.set(m.id, n);
    }
    n.role = m.role;
    n.label = m.label;
    n.state = m.state;
    n.tool = m.tool || "";
    n.tokens = m.tokens || 0;
    n.ts = m.ts || 0;
    n.hit = performance.now();
  }

  function addEdge(m) {
    edges.set(`${m.from}|${m.to}|${m.rel}`, { from: m.from, to: m.to, rel: m.rel });
  }

  function handle(m) {
    if (m.kind === "node") upsertNode(m);
    else if (m.kind === "edge") addEdge(m);
    else if (m.kind === "pulse") pulses.push({ from: m.from, to: m.to, t0: performance.now() });
    emptyEl.classList.toggle("hidden", nodes.size > 1 || edges.size > 0);
    if (nodes.size === 1) emptyWhy.textContent = "lead is running — no crew spawned yet";
  }

  // ---- stream --------------------------------------------------------------

  const stream = new EventSource("/events");
  stream.onopen = () => { statusEl.textContent = "live"; statusEl.className = "live"; };
  stream.onerror = () => { statusEl.textContent = "reconnecting"; statusEl.className = "down"; };
  stream.onmessage = ev => {
    try { handle(JSON.parse(ev.data)); } catch (_) { /* a partial frame is not fatal */ }
  };

  // ---- layout --------------------------------------------------------------

  const REPULSION = 42000;
  const SPRING = 0.012;
  const REST = 170;
  const DAMPING = 0.86;

  function step() {
    const list = [...nodes.values()];
    for (const n of list) {
      let fx = 0, fy = 0;
      for (const o of list) {
        if (o === n) continue;
        let dx = n.x - o.x, dy = n.y - o.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
        const f = REPULSION / d2;
        const d = Math.sqrt(d2);
        fx += (dx / d) * f;
        fy += (dy / d) * f;
      }
      // The lead anchors the middle; everything else arranges around it.
      const pullX = width / 2 - n.x, pullY = height / 2 - n.y;
      const gravity = n.role === "lead" ? 0.06 : 0.008;
      fx += pullX * gravity;
      fy += pullY * gravity;

      n.fx = fx; n.fy = fy;
    }

    for (const e of edges.values()) {
      const a = nodes.get(e.from), b = nodes.get(e.to);
      if (!a || !b) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1;
      const f = (d - REST) * SPRING;
      const ux = dx / d, uy = dy / d;
      a.fx += ux * f * 60; a.fy += uy * f * 60;
      b.fx -= ux * f * 60; b.fy -= uy * f * 60;
    }

    for (const n of list) {
      n.vx = (n.vx + n.fx * 0.0016) * DAMPING;
      n.vy = (n.vy + n.fy * 0.0016) * DAMPING;
      n.x += n.vx;
      n.y += n.vy;
      const r = radiusOf(n) + 40;
      n.x = Math.max(r, Math.min(width - r, n.x));
      n.y = Math.max(r + 30, Math.min(height - r - 30, n.y));
    }
  }

  function radiusOf(n) {
    const base = n.role === "lead" ? 16 : 11;
    return base + 5 * Math.log2(1 + (n.tokens || 0) / 4000);
  }

  function fmtTokens(t) {
    if (!t) return "";
    return t >= 1000 ? (t / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(t);
  }

  // ---- render --------------------------------------------------------------

  function draw(now) {
    ctx.clearRect(0, 0, width, height);

    for (const e of edges.values()) {
      const a = nodes.get(e.from), b = nodes.get(e.to);
      if (!a || !b) continue;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = e.rel === "report" ? "rgba(224,166,60,.34)" : "rgba(242,240,234,.11)";
      ctx.lineWidth = e.rel === "report" ? 1.4 : 1;
      ctx.setLineDash(e.rel === "report" ? [] : [3, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      const t = (now - p.t0) / PULSE_MS;
      if (t >= 1) { pulses.splice(i, 1); continue; }
      const a = nodes.get(p.from), b = nodes.get(p.to);
      if (!a || !b) { pulses.splice(i, 1); continue; }
      const eased = t * t * (3 - 2 * t);
      const x = a.x + (b.x - a.x) * eased;
      const y = a.y + (b.y - a.y) * eased;
      const fade = 1 - t;
      ctx.beginPath();
      ctx.arc(x, y, 2.6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(224,166,60,${0.85 * fade})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, 8 * (1 + t), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(224,166,60,${0.18 * fade})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    for (const n of nodes.values()) {
      const r = radiusOf(n);
      const lead = n.role === "lead";
      const accent = lead ? "224,166,60" : "242,240,234";
      const done = n.state === "done";

      if (n.state === "thinking" || n.state === "tool") {
        const breathe = 0.5 + 0.5 * Math.sin(now / 340 + n.x);
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 6 + breathe * 5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${accent},${0.05 + breathe * 0.05})`;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = done ? `rgba(${accent},.10)` : `rgba(${accent},.18)`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.setLineDash(n.state === "waiting" || done ? [2, 3] : []);
      ctx.strokeStyle = done ? `rgba(${accent},.35)` : `rgba(${accent},.95)`;
      ctx.lineWidth = n.state === "tool" ? 2 : 1;
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.textAlign = "center";
      ctx.fillStyle = done ? "rgba(242,240,234,.45)" : "rgba(242,240,234,.92)";
      ctx.font = "12px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.fillText(n.label, n.x, n.y + r + 16);

      const sub = n.state === "tool" && n.tool ? n.tool : (done ? "done" : n.state);
      ctx.fillStyle = lead ? "rgba(224,166,60,.75)" : "rgba(107,107,100,.95)";
      ctx.font = "10px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.fillText(sub, n.x, n.y + r + 29);

      const tk = fmtTokens(n.tokens);
      if (tk) {
        ctx.fillStyle = "rgba(107,107,100,.7)";
        ctx.fillText(tk, n.x, n.y + r + 41);
      }
    }
  }

  function frame(now) {
    step();
    draw(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
