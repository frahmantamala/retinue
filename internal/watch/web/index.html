<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>retinue watch</title>
<style>
  :root {
    --ground: #0e0e0d;
    --ink: #f2f0ea;
    --marigold: #e0a63c;
    --muted: #6b6b64;
    --dim: #2a2a27;
    --rail: 330px;
  }
  @media (max-width: 860px) { :root { --rail: 0px; } #rail { display: none; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow: hidden;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; gap: 20px; align-items: baseline;
    padding: 14px 18px;
    pointer-events: none;
  }
  h1 { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; margin: 0; color: var(--marigold); }
  .meta { color: var(--muted); }
  .meta b { color: var(--ink); font-weight: 400; }
  #spend b { color: var(--marigold); }
  #spend .partial { color: #c1553f; }
  #status { margin-left: auto; color: var(--muted); }
  #status.live::before { content: "● "; color: #7fb069; }
  #status.down::before { content: "● "; color: #c1553f; }
  #empty {
    position: fixed; inset: 0 var(--rail) 0 0;
    display: grid; place-content: center; place-items: center; gap: 6px;
    color: var(--muted); text-align: center; pointer-events: none;
  }
  #empty.hidden { display: none; }
  #empty .big { color: var(--ink); letter-spacing: .04em; }
  footer {
    position: fixed; bottom: 0; left: 0; right: var(--rail);
    display: flex; gap: 18px; padding: 14px 18px;
    color: var(--muted); pointer-events: none;
  }
  .key { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 9px; height: 9px; border-radius: 50%; }

  #rail {
    position: fixed; top: 0; right: 0; bottom: 0; width: var(--rail);
    display: flex; flex-direction: column; min-height: 0;
    padding-top: 44px;
    border-left: 1px solid var(--dim);
    background: rgba(14, 14, 13, .93);
  }
  #rail section { display: flex; flex-direction: column; min-height: 0; }
  #rail section.grow { flex: 1; }
  #rail h2 {
    margin: 0; padding: 14px 16px 6px;
    font-size: 10px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted);
  }
  #rail h2 span { color: var(--dim); }
  #rail ul { list-style: none; margin: 0; padding: 0 16px 10px; overflow-y: auto; }
  #knowledge { max-height: 32vh; }
  #run { padding: 0 16px 10px; }
  #run .row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
  #run .k { color: var(--muted); }
  #run .v { text-align: right; }
  #run .v.accent { color: var(--marigold); }
  #run .v.warn { color: #c1553f; }
  #run .v.soft { color: var(--muted); }
  #activity { flex: 1; }
  #rail li { display: flex; gap: 8px; padding: 2px 0; align-items: baseline; }
  #rail li.none { color: var(--dim); }
  .at { color: var(--dim); flex: none; }
  .who { flex: none; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who.lead { color: var(--marigold); }
  .did { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .did b { color: rgba(242,240,234,.8); font-weight: 400; }
  .page { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .via { flex: none; color: var(--dim); }
  .via.brief { color: rgba(224,166,60,.7); }
  .via.wrote { color: rgba(127,176,105,.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header>
  <h1>retinue watch</h1>
  <div class="meta" id="sessionMeta"></div>
  <div class="meta" id="spend"></div>
  <div id="status">connecting</div>
</header>

<div id="empty">
  <div class="big">waiting for events</div>
  <div id="emptyWhy">no agent activity on this session yet</div>
</div>

<aside id="rail">
  <section>
    <h2>run</h2>
    <div id="run"><div class="row"><span class="k">waiting</span><span class="v">—</span></div></div>
  </section>
  <section>
    <h2>knowledge <span id="knowledgeCount"></span></h2>
    <ul id="knowledge"><li class="none">no wiki pages reached the crew yet</li></ul>
  </section>
  <section class="grow">
    <h2>activity</h2>
    <ul id="activity"><li class="none">nothing yet</li></ul>
  </section>
</aside>

<footer>
  <span class="key"><span class="swatch" style="background:var(--marigold)"></span>lead</span>
  <span class="key"><span class="swatch" style="background:var(--ink)"></span>crew</span>
  <span class="key">solid ring = running tool</span>
  <span class="key">dashed = idle</span>
  <span class="key">radius = tokens</span>
</footer>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("status");
  const emptyEl = document.getElementById("empty");
  const emptyWhy = document.getElementById("emptyWhy");

  const railEl = document.getElementById("rail");
  const spendEl = document.getElementById("spend");
  const runEl = document.getElementById("run");
  const activityEl = document.getElementById("activity");
  const knowledgeEl = document.getElementById("knowledge");
  const knowledgeCount = document.getElementById("knowledgeCount");

  const nodes = new Map();   // id -> node model
  const edges = new Map();   // key -> {from, to, rel}
  const pulses = [];         // {from, to, t0}
  const pages = new Map();   // wiki page -> {via:Set, who:Set}

  const PULSE_MS = 900;
  const ACTIVITY_ROWS = 80;
  let width = 0, height = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  fetch("/session").then(r => r.json()).then(s => {
    document.getElementById("sessionMeta").innerHTML =
      `<b>${escapeHtml(s.repo.split("/").pop())}</b> · session <b>${escapeHtml(s.id.slice(0, 8))}</b>`;
  }).catch(() => {});

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---- model ---------------------------------------------------------------

  function upsertNode(m) {
    let n = nodes.get(m.id);
    if (!n) {
      // Seed crew around the centre so the layout unfolds outward from the lead.
      const angle = Math.random() * Math.PI * 2;
      const radius = m.role === "lead" ? 0 : 120 + Math.random() * 90;
      n = {
        id: m.id,
        x: (width - (railEl.offsetWidth || 0)) / 2 + Math.cos(angle) * radius,
        y: height / 2 + Math.sin(angle) * radius,
        vx: 0, vy: 0,
      };
      nodes.set(m.id, n);
    }
    n.role = m.role;
    n.label = m.label;
    n.state = m.state;
    n.tool = m.tool || "";
    n.tokens = m.tokens || 0;
    n.cost = m.cost || 0;
    n.model = m.model || "";
    n.unpriced = m.unpriced || 0;
    n.ts = m.ts || 0;
    n.hit = performance.now();
    renderSpend();
  }

  function renderSpend() {
    let total = 0, unpriced = 0;
    for (const n of nodes.values()) { total += n.cost || 0; unpriced += n.unpriced || 0; }
    if (!total && !unpriced) { spendEl.textContent = ""; return; }
    // A model with no published rate is reported, never folded into the total
    // as zero — a low number you trust is worse than one you know is partial.
    spendEl.innerHTML = `<b>${fmtCost(total)}</b> spent` +
      (unpriced ? ` <span class="partial" title="${unpriced} tokens on a model with no rate in this build">+ unpriced</span>` : "");
  }

  function fmtCost(c) {
    if (!c) return "$0";
    if (c < 0.01) return "<$0.01";
    return "$" + c.toFixed(2);
  }

  function addEdge(m) {
    edges.set(`${m.from}|${m.to}|${m.rel}`, { from: m.from, to: m.to, rel: m.rel });
  }

  function labelFor(id) {
    const n = nodes.get(id);
    return n ? n.label : id.slice(0, 12);
  }

  function clockOf(ts) {
    if (!ts) return "--:--";
    const d = new Date(ts);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function pushActivity(m) {
    const none = activityEl.querySelector(".none");
    if (none) none.remove();

    const li = document.createElement("li");
    const isLead = nodes.get(m.id)?.role === "lead";
    li.innerHTML =
      `<span class="at">${clockOf(m.ts)}</span>` +
      `<span class="who${isLead ? " lead" : ""}">${escapeHtml(labelFor(m.id))}</span>` +
      `<span class="did"><b>${escapeHtml(m.tool)}</b> ${escapeHtml(m.detail || "")}</span>`;
    li.title = `${labelFor(m.id)} · ${m.tool} ${m.detail || ""}`;

    activityEl.prepend(li);
    while (activityEl.children.length > ACTIVITY_ROWS) activityEl.lastElementChild.remove();
  }

  function addKnowledge(m) {
    let e = pages.get(m.page);
    if (!e) { e = { via: new Set(), who: new Set() }; pages.set(m.page, e); }
    e.via.add(m.via);
    e.who.add(m.id);
    renderKnowledge();
  }

  function renderKnowledge() {
    knowledgeCount.textContent = pages.size ? "· " + pages.size : "";
    knowledgeEl.textContent = "";
    if (!pages.size) {
      const li = document.createElement("li");
      li.className = "none";
      li.textContent = "no wiki pages reached the crew yet";
      knowledgeEl.append(li);
      return;
    }
    for (const [page, e] of pages) {
      // Ordered by how much each says about the run: "brief" means the lead put
      // the page in front of an agent, "wrote" means the run fed the wiki back.
      const via = e.via.has("brief") ? "brief" : e.via.has("wrote") ? "wrote" : "read";
      const who = [...e.who].map(labelFor).join(", ");
      const li = document.createElement("li");
      li.innerHTML =
        `<span class="page">${escapeHtml(page)}</span>` +
        `<span class="via ${via}">${via} · ${e.who.size}</span>`;
      li.title = `${page} — ${via}: ${who}`;
      knowledgeEl.append(li);
    }
  }

  function fmtDuration(ms) {
    if (!ms || ms < 0) return "—";
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + "s";
    const m = Math.floor(s / 60);
    if (m < 60) return m + "m";
    return Math.floor(m / 60) + "h " + (m % 60) + "m";
  }

  function renderRun(r) {
    const rows = [];
    const elapsed = r.latestTs && r.startedTs ? r.latestTs - r.startedTs : 0;
    rows.push(["elapsed", fmtDuration(elapsed), ""]);

    if (r.tasksTotal) {
      const live = r.tasksLive ? `, ${r.tasksLive} running` : "";
      rows.push(["tasks", `${r.tasksDone} of ${r.tasksTotal} done${live}`, ""]);
      // Linear extrapolation on task count. Lanes are not equal size — this is
      // a rough read, and the title says so rather than implying precision.
      if (r.tasksDone > 0 && r.tasksDone < r.tasksTotal && elapsed > 0) {
        const perTask = elapsed / r.tasksDone;
        rows.push(["~left", fmtDuration((r.tasksTotal - r.tasksDone) * perTask), "soft",
          "Rough: elapsed per completed task, extrapolated. Lanes differ in size."]);
      }
    }

    if (r.burnPerHour > 0) rows.push(["burn", fmtCost(r.burnPerHour) + " / hr", "accent"]);

    if (r.budget > 0) {
      const left = r.budget - r.spent;
      if (left <= 0) {
        rows.push(["budget", `${fmtCost(r.budget)} — over by ${fmtCost(-left)}`, "warn"]);
      } else if (r.burnPerHour > 0) {
        const hours = left / r.burnPerHour;
        rows.push(["budget", `${fmtCost(left)} left — ${fmtDuration(hours * 3600000)}`,
          hours < 1 ? "warn" : ""]);
      } else {
        rows.push(["budget", `${fmtCost(left)} left`, ""]);
      }
    }

    runEl.textContent = "";
    for (const [k, v, cls, title] of rows) {
      const row = document.createElement("div");
      row.className = "row";
      if (title) row.title = title;
      row.innerHTML = `<span class="k">${escapeHtml(k)}</span><span class="v ${cls || ""}">${escapeHtml(v)}</span>`;
      runEl.append(row);
    }
  }

  function handle(m) {
    if (m.kind === "run") return renderRun(m);
    if (m.kind === "node") upsertNode(m);
    else if (m.kind === "edge") addEdge(m);
    else if (m.kind === "pulse") pulses.push({ from: m.from, to: m.to, t0: performance.now() });
    else if (m.kind === "activity") pushActivity(m);
    else if (m.kind === "knowledge") addKnowledge(m);
    emptyEl.classList.toggle("hidden", nodes.size > 1 || edges.size > 0);
    if (nodes.size === 1) emptyWhy.textContent = "lead is running — no crew spawned yet";
  }

  // ---- stream --------------------------------------------------------------

  const stream = new EventSource("/events");
  stream.onopen = () => { statusEl.textContent = "live"; statusEl.className = "live"; };
  stream.onerror = () => { statusEl.textContent = "reconnecting"; statusEl.className = "down"; };
  stream.onmessage = ev => {
    try { handle(JSON.parse(ev.data)); } catch (_) { /* a partial frame is not fatal */ }
  };

  // ---- layout --------------------------------------------------------------

  const REPULSION = 42000;
  const SPRING = 0.012;
  const REST = 170;
  const DAMPING = 0.86;

  function step() {
    const list = [...nodes.values()];
    const rail = railEl.offsetWidth || 0;   // 0 once the rail is hidden on narrow screens
    const cx = (width - rail) / 2;
    for (const n of list) {
      let fx = 0, fy = 0;
      for (const o of list) {
        if (o === n) continue;
        let dx = n.x - o.x, dy = n.y - o.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
        const f = REPULSION / d2;
        const d = Math.sqrt(d2);
        fx += (dx / d) * f;
        fy += (dy / d) * f;
      }
      // The lead anchors the middle; everything else arranges around it.
      const pullX = cx - n.x, pullY = height / 2 - n.y;
      const gravity = n.role === "lead" ? 0.06 : 0.008;
      fx += pullX * gravity;
      fy += pullY * gravity;

      n.fx = fx; n.fy = fy;
    }

    for (const e of edges.values()) {
      const a = nodes.get(e.from), b = nodes.get(e.to);
      if (!a || !b) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1;
      const f = (d - REST) * SPRING;
      const ux = dx / d, uy = dy / d;
      a.fx += ux * f * 60; a.fy += uy * f * 60;
      b.fx -= ux * f * 60; b.fy -= uy * f * 60;
    }

    for (const n of list) {
      n.vx = (n.vx + n.fx * 0.0016) * DAMPING;
      n.vy = (n.vy + n.fy * 0.0016) * DAMPING;
      n.x += n.vx;
      n.y += n.vy;
      const r = radiusOf(n) + 40;
      n.x = Math.max(r, Math.min(width - rail - r, n.x));
      n.y = Math.max(r + 30, Math.min(height - r - 30, n.y));
    }
  }

  function radiusOf(n) {
    const base = n.role === "lead" ? 16 : 11;
    return base + 5 * Math.log2(1 + (n.tokens || 0) / 4000);
  }

  function fmtTokens(t) {
    if (!t) return "";
    return t >= 1000 ? (t / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(t);
  }

  // ---- render --------------------------------------------------------------

  function draw(now) {
    ctx.clearRect(0, 0, width, height);

    for (const e of edges.values()) {
      const a = nodes.get(e.from), b = nodes.get(e.to);
      if (!a || !b) continue;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = e.rel === "report" ? "rgba(224,166,60,.34)" : "rgba(242,240,234,.11)";
      ctx.lineWidth = e.rel === "report" ? 1.4 : 1;
      ctx.setLineDash(e.rel === "report" ? [] : [3, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      const t = (now - p.t0) / PULSE_MS;
      if (t >= 1) { pulses.splice(i, 1); continue; }
      const a = nodes.get(p.from), b = nodes.get(p.to);
      if (!a || !b) { pulses.splice(i, 1); continue; }
      const eased = t * t * (3 - 2 * t);
      const x = a.x + (b.x - a.x) * eased;
      const y = a.y + (b.y - a.y) * eased;
      const fade = 1 - t;
      ctx.beginPath();
      ctx.arc(x, y, 2.6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(224,166,60,${0.85 * fade})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, 8 * (1 + t), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(224,166,60,${0.18 * fade})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    for (const n of nodes.values()) {
      const r = radiusOf(n);
      const lead = n.role === "lead";
      const accent = lead ? "224,166,60" : "242,240,234";
      const done = n.state === "done";

      if (n.state === "thinking" || n.state === "tool") {
        const breathe = 0.5 + 0.5 * Math.sin(now / 340 + n.x);
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 6 + breathe * 5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${accent},${0.05 + breathe * 0.05})`;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = done ? `rgba(${accent},.10)` : `rgba(${accent},.18)`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.setLineDash(n.state === "waiting" || done ? [2, 3] : []);
      ctx.strokeStyle = done ? `rgba(${accent},.35)` : `rgba(${accent},.95)`;
      ctx.lineWidth = n.state === "tool" ? 2 : 1;
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.textAlign = "center";
      ctx.fillStyle = done ? "rgba(242,240,234,.45)" : "rgba(242,240,234,.92)";
      ctx.font = "12px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.fillText(n.label, n.x, n.y + r + 16);

      const sub = n.state === "tool" && n.tool ? n.tool : (done ? "done" : n.state);
      ctx.fillStyle = lead ? "rgba(224,166,60,.75)" : "rgba(107,107,100,.95)";
      ctx.font = "10px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.fillText(sub, n.x, n.y + r + 29);

      const tk = fmtTokens(n.tokens);
      const spend = n.cost ? fmtCost(n.cost) : "";
      if (tk || spend) {
        ctx.fillStyle = "rgba(107,107,100,.7)";
        ctx.fillText([tk, spend].filter(Boolean).join(" · "), n.x, n.y + r + 41);
      }
    }
  }

  function frame(now) {
    step();
    draw(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
