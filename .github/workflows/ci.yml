name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -w these files:"
            echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      # -race because the tailer writes the graph while HTTP handlers read it.
      - run: go test -race ./...

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The page is go:embed'ed, so a syntax error in it ships silently — the Go
      # build cannot see inside the file.
      - name: page script parses
        run: |
          python3 - <<'PY' > /tmp/page.js
          import re, sys
          src = open('internal/watch/web/index.html').read()
          m = re.search(r'<script>(.*)</script>', src, re.S)
          if not m:
              sys.exit('no inline script found in the page')
          print(m.group(1))
          PY
          node --check /tmp/page.js

      - name: page stays self-contained
        run: |
          if grep -nEi 'src=|href=|https?://' internal/watch/web/index.html; then
            echo "the monitor page must not reference anything external — inline it"
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The run-loop diagram is duplicated on purpose — the README sells the loop,
      # the playbook binds the lead to it — and nothing else keeps the copies equal.
      - name: run-loop diagram stays in sync
        run: |
          python3 - <<'PY'
          import re, sys

          def run_loop(path):
              blocks = re.findall(r'```mermaid\n(.*?)```', open(path).read(), re.S)
              hits = [b for b in blocks if 'Load wiki + repo context' in b]
              if len(hits) != 1:
                  sys.exit(f'{path}: expected exactly 1 run-loop mermaid block, found {len(hits)}')
              return hits[0]

          a, b = 'README.md', 'TEAM-PLAYBOOK.md'
          if run_loop(a) != run_loop(b):
              sys.exit(f'{a} and {b} disagree on the run-loop diagram. It is duplicated '
                       'deliberately and must be kept identical — apply the edit to both.')
          PY

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck --severity=warning scripts/*.sh install.sh

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A malformed settings file silently disables every setting in it, so the
      # example people copy from has to parse.
      - run: jq empty settings.example.json
